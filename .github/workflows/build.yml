name: build-wolfunit-master
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: raetro/quartus:17.0
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v3

      - name: fetch sv2v
        run: |
          curl -sL -o /tmp/sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.12/sv2v-Linux.zip
          cd /tmp && unzip -q sv2v.zip && chmod +x sv2v-Linux/sv2v
          /tmp/sv2v-Linux/sv2v --version

      - name: sv2v convert (master-core macros)
        run: |
          export SV2V=/tmp/sv2v-Linux/sv2v
          export SV2V_EXTRA="-DWOLF_MASTER=1 -DUSE_DDR3_GFX=1 -DUSE_DDR3_VRAM=1"
          bash quartus/build_sv2v.sh

      - name: quartus map
        run: |
          quartus_map Arcade-SmashTV -c Arcade-SmashTV \
            --verilog_macro="WOLF_MASTER=1" \
            --verilog_macro="USE_DDR3_GFX=1" \
            --verilog_macro="USE_DDR3_VRAM=1" 2>&1 | tee build_syn/hw_map.log | tail -4
          test ${PIPESTATUS[0]} -eq 0
        shell: bash

      - name: quartus fit
        run: |
          quartus_fit Arcade-SmashTV -c Arcade-SmashTV 2>&1 | tee build_syn/hw_fit.log | tail -4
          test ${PIPESTATUS[0]} -eq 0
        shell: bash

      - name: quartus sta + timing gate
        run: |
          quartus_sta Arcade-SmashTV -c Arcade-SmashTV 2>&1 | tee build_syn/hw_sta.log | grep -iE "slack|error" | tail -8
          test ${PIPESTATUS[0]} -eq 0
          bash quartus/check_timing.sh build_syn/hw_sta.log
        shell: bash

      - name: quartus asm (RBF)
        run: |
          quartus_asm Arcade-SmashTV -c Arcade-SmashTV 2>&1 | tee build_syn/hw_asm.log | tail -4
          test ${PIPESTATUS[0]} -eq 0
          cp output_files/q256_scanfix/Arcade-SmashTV.rbf Arcade-WolfUnit.rbf
        shell: bash

      - uses: actions/upload-artifact@v3
        with:
          name: Arcade-WolfUnit-SuperMax
          path: |
            Arcade-WolfUnit.rbf
            build_syn/hw_sta.log
